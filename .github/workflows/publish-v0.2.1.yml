name: publish-profile-v0.2.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.2.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: e1aaff7d2cd50d5d5ed9ab76c3606a6ef39d1976
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify normative release target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "$TARGET_SHA:VERSION" | tr -d '\r\n')" = "0.2.1"
          git merge-base --is-ancestor "$TARGET_SHA" HEAD

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.2.1" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.2.1" --jq '.object.sha')"
            test "$existing" = "$TARGET_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v0.2.1' \
              -f sha="$TARGET_SHA"
          fi

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.1 >/dev/null 2>&1; then
            echo 'Release v0.2.1 already exists.'
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          PATCH clarification of the existing System 2 evidence threshold.

          Key changes:
          - positive S2 mappings explicitly reconstruct distinct S1 units, a specific actual or structurally evidenced interference/conflict/oscillation, an attenuating coordination relation, and feedback into subsequent S1 behaviour;
          - generic routing, mailboxes, shared state, sequencing, speaker selection, or delegation remain insufficient unless tied to regulation of a specific inter-S1 disturbance;
          - coordination ownership remains separate from deterministic enforcement;
          - conforming Profile v0.2.0 mappings remain conforming; weak historical positives are assessment corrections rather than semantic migrations.

          Release target: `e1aaff7d2cd50d5d5ed9ab76c3606a6ef39d1976`.
          EOF
          gh release create v0.2.1 \
            --title 'VSM Harness Profile v0.2.1' \
            --notes-file /tmp/release-notes.md
