name: publish-profile-v0.2.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.2.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: b9a9e8583b05ac1f21a05c6a048591113a9925bf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify normative release target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "$TARGET_SHA:VERSION" | tr -d '\r\n')" = "0.2.0"
          git merge-base --is-ancestor "$TARGET_SHA" HEAD

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.2.0" >/tmp/tag.json 2>/dev/null; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.2.0" --jq '.object.sha')"
            test "$existing" = "$TARGET_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v0.2.0' \
              -f sha="$TARGET_SHA"
          fi

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo 'Release v0.2.0 already exists.'
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          First explicitly versioned normative VSM Harness Profile release.

          Key changes:
          - separates organizational function, decisive decision/feedback right, owner, supporting enforcement, and closure;
          - states that deterministic enforcement does not transfer ownership of the underlying organizational decision;
          - adds the counterfactual owner test for ambiguous hybrid agent/runtime mechanisms;
          - strengthens S3, S3*, S4, and S5 closure/ownership reasoning;
          - introduces explicit Profile versioning and downstream provenance guidance.

          Release target: `b9a9e8583b05ac1f21a05c6a048591113a9925bf`.

          The pre-versioned line may be called the v0.1.0 baseline for migration discussion, but no historical v0.1.0 release or tag is asserted.
          EOF
          gh release create v0.2.0 \
            --title 'VSM Harness Profile v0.2.0' \
            --notes-file /tmp/release-notes.md
