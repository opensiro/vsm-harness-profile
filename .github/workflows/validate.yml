name: validate

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  profile-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_repository.py
      - run: python -m unittest discover -s tests -v
