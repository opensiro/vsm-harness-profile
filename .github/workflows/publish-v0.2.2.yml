name: publish-profile-v0.2.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.2.2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 83d2768cdb26685fae80f4671be47d9235b0f9d5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "$TARGET_SHA:VERSION" | tr -d '\r\n')" = "0.2.2"
          git merge-base --is-ancestor "$TARGET_SHA" HEAD
          python scripts/validate_repository.py
          python -m unittest discover -s tests -v

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.2.2" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.2.2" --jq '.object.sha')"
            test "$existing" = "$TARGET_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v0.2.2' \
              -f sha="$TARGET_SHA"
          fi

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.2 >/dev/null 2>&1; then
            echo 'Release v0.2.2 already exists.'
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          PATCH clarification of the agent-actor vs agent-harness analysis boundary, plus the stable downstream compatibility/reassessment-impact facade.

          Key changes:
          - distinguishes an agent actor from the harness that structures, enables, and governs the agentic process;
          - makes explicit that harness control may be deterministic, agentic, or hybrid without prescribing implementation topology;
          - adds `CONSUMER_CONTRACT.md` and machine-readable `RELEASE_IMPACT.json`;
          - separates immutable Profile provenance from compatibility with later releases;
          - declares Profile v0.2.2 as `compatible` with `assessment_impact: none`, so existing conforming assessments do not require reassessment merely because the Profile version advanced;
          - adds deterministic validation for release-impact chains, selectors, and SemVer/impact consistency.

          No S1-S5 function, ownership rule, autonomy state, or evidence threshold changes in this PATCH.

          Release target: `83d2768cdb26685fae80f4671be47d9235b0f9d5`.
          EOF
          gh release create v0.2.2 \
            --title 'VSM Harness Profile v0.2.2' \
            --notes-file /tmp/release-notes.md
